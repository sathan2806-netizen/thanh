
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          file=$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/.gradle/*' -print -quit)
          if [ -z "$file" ]; then
            echo "ERROR: settings.gradle not found"
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi
          dir=$(dirname "$file")
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "Project found: $dir"

      - name: Build debug APK
        shell: bash
        run: |
          cd "${"{ steps.project.outputs.dir }"}"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoAppManager-debug-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 30
  
