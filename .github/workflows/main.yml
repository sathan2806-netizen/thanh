name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f AutoAppManager-Restart-Fixed.zip
          mkdir -p extracted
          unzip -q -o AutoAppManager-Restart-Fixed.zip -d extracted
          echo "Source extracted successfully"

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          file=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          if [ -z "$file" ]; then
            echo "ERROR: Android Gradle project not found in ZIP"
            find extracted -maxdepth 5 -type f
            exit 1
          fi
          dir=$(dirname "$file")
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "Android project found at $dir"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Build APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Collect APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk-output
          find extracted -type f -path '*/build/outputs/apk/debug/*.apk' -exec cp {} apk-output/ \;
          test -n "$(find apk-output -name '*.apk' -print -quit)"
          ls -lh apk-output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoAppManager-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30
